<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>KClock</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='45' fill='%23534AB7'/%3E%3Cpath d='M50 25v25l20 12' stroke='%23fff' stroke-width='10' stroke-linecap='round' fill='none'/%3E%3C/svg%3E">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

  :root {
    --bg: #0f0f0f;
    --surface: #1a1a1a;
    --surface2: #242424;
    --border: #2e2e2e;
    --text: #f0f0f0;
    --muted: #888;
    --accent: #7F77DD;
    --accent2: #5DCAA5;
    --btn-bg: #242424;
    --btn-border: #3a3a3a;
    --danger: #E24B4A;
  }

  .light {
    --bg: #f5f5f0;
    --surface: #ffffff;
    --surface2: #f0f0ea;
    --border: #e0e0d8;
    --text: #1a1a1a;
    --muted: #777;
    --accent: #534AB7;
    --accent2: #0F6E56;
    --btn-bg: #ffffff;
    --btn-border: #d0d0c8;
    --danger: #A32D2D;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-sans, system-ui);
    min-height: 100vh;
    transition: background .3s, color .3s
  }

  .wrap {
    max-width: 900px;
    margin: 0 auto;
    padding: 2rem 1.5rem 3rem;
  }

  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 1.5rem;
  }

  .logo {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    font-size: 22px;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: 0.05em;
  }

  .logo-icon {
    font-size: 1.2em;
    line-height: 1;
    color: inherit;
  }

  .theme-btn {
    background: var(--btn-bg);
    border: 0.5px solid var(--btn-border);
    color: var(--text);
    padding: 8px 16px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 14px;
    transition: background .2s;
  }

  .theme-btn:hover {
    background: var(--surface2)
  }

  .tabs {
    display: flex;
    gap: 4px;
    background: var(--surface2);
    padding: 4px;
    border-radius: 10px;
    margin-bottom: 1.5rem
  }

  .tab {
    flex: 1;
    padding: 8px;
    text-align: center;
    border-radius: 7px;
    cursor: pointer;
    font-size: 14px;
    color: var(--muted);
    transition: all .2s;
    border: none;
    background: transparent
  }

  .tab.active {
    background: var(--surface);
    color: var(--text);
    font-weight: 500
  }

  .panel {
    display: none
  }

  .panel.active {
    display: block
  }

  .clock-display {
    text-align: center;
    padding: 3rem 0 2rem;
  }

  .time-big {
    font-size: 120px;
    font-weight: 600;
    letter-spacing: -3px;
    font-variant-numeric: tabular-nums;
    color: var(--text);
    line-height: 1;
  }

  .date-line {
    font-size: 18px;
    color: var(--muted);
    margin-top: 12px;
  }

  .alarm-section {
    background: var(--surface);
    border: 0.5px solid var(--border);
    border-radius: 12px;
    padding: 1.25rem;
    margin-bottom: 1rem
  }

  .section-label {
    font-size: 12px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: .05em;
    margin-bottom: .75rem
  }

  .time-inputs {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 1rem
  }

  .time-input {
    background: var(--surface2);
    border: 0.5px solid var(--border);
    color: var(--text);
    border-radius: 10px;
    padding: 14px 18px;
    font-size: 36px;
    font-weight: 600;
    width: 110px;
    text-align: center;
    font-variant-numeric: tabular-nums;
  }

  .time-input:focus {
    outline: none;
    border-color: var(--accent)
  }

  .sep {
    font-size: 28px;
    font-weight: 500;
    color: var(--muted)
  }

  .btn-row {
    display: flex;
    gap: 8px
  }

  .btn {
    flex: 1;
    padding: 10px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 500;
    border: 0.5px solid var(--btn-border);
    background: var(--btn-bg);
    color: var(--text);
    transition: all .2s
  }

  .btn:hover {
    background: var(--surface2)
  }

  .btn.primary {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent)
  }

  .btn.primary:hover {
    opacity: .9
  }

  .btn.danger {
    background: var(--danger);
    color: #fff;
    border-color: var(--danger)
  }

  .btn.danger:hover {
    opacity: .9
  }

  .alarm-status {
    text-align: center;
    padding: .75rem;
    border-radius: 8px;
    font-size: 14px;
    margin-top: .75rem;
    background: var(--surface2)
  }

  .alarm-status.set {
    color: var(--accent2)
  }

  .alarm-status.ringing {
    color: var(--danger);
    font-weight: 500;
    animation: pulse 1s infinite
  }

  @keyframes pulse {

    0%,
    100% {
      opacity: 1
    }

    50% {
      opacity: .5
    }
  }

  .timer-fullscreen-area {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 320px;
    width: 100%;
  }

  .timer-fullscreen-area:fullscreen,
  .timer-fullscreen-area:-webkit-full-screen,
  .timer-fullscreen-area:-moz-full-screen,
  .timer-fullscreen-area.fullscreen-active {
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
  }

  .timer-fullscreen-area.light:fullscreen,
  .timer-fullscreen-area.light:-webkit-full-screen,
  .timer-fullscreen-area.light:-moz-full-screen,
  .timer-fullscreen-area.light.fullscreen-active {
    background: #f5f5f0;
    color: #1a1a1a;
  }

  .timer-fullscreen-area.light.fullscreen-active .timer-big {
    color: #1a1a1a;
  }

  .timer-fullscreen-area.light.fullscreen-active .fullscreen-btn {
    background: #ffffff;
    border-color: #d0d0c8;
    color: #1a1a1a;
  }

  .timer-fullscreen-area.fullscreen-active .timer-display {
    width: 100%;
  }

  .timer-display {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 3rem 0 1.5rem;
    width: 100%;
  }

  .timer-note {
    display: none;
    margin-bottom: 1rem;
    background: var(--surface2);
    border: 0.5px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    padding: 14px 16px;
    font-size: 59px;
    font-weight: 600;
    min-height: 54px;
    line-height: 1.4;
    align-items: center;
    justify-content: center;
    width: min(100%, 520px);
  }

  #timerNoteDisplay:empty {
    display: none;
  }

  .fullscreen-btn {
    position: absolute;
    top: 12px;
    right: 12px;
    width: 42px;
    height: 42px;
    border-radius: 12px;
    border: 0.5px solid var(--btn-border);
    background: var(--btn-bg);
    color: var(--text);
    font-size: 18px;
    cursor: pointer;
    transition: background .2s, transform .2s;
  }

  .fullscreen-btn:hover {
    background: var(--surface2);
    transform: scale(1.05);
  }

  .timer-big {
    font-size: 120px;
    font-weight: 600;
    letter-spacing: -1px;
    font-variant-numeric: tabular-nums;
    color: var(--text);
  }

  .timer-controls {
    background: var(--surface);
    border: 0.5px solid var(--border);
    border-radius: 12px;
    padding: 1.25rem
  }

  .note-row {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 1rem;
  }

  .note-input {
    width: 100%;
    background: var(--surface2);
    border: 0.5px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 12px 14px;
    font-size: 20px;
  }

  .note-input:focus {
    outline: none;
    border-color: var(--accent)
  }

  .duration-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 1rem
  }

  .dur-input {
    background: var(--surface2);
    border: 0.5px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 20px;
    font-weight: 500;
    width: 60px;
    text-align: center
  }

  .dur-input:focus {
    outline: none;
    border-color: var(--accent)
  }

  .dur-label {
    font-size: 13px;
    color: var(--muted)
  }

  .quick-btns {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-bottom: 1rem
  }

  .quick-btn {
    padding: 5px 12px;
    border-radius: 6px;
    border: 0.5px solid var(--btn-border);
    background: var(--btn-bg);
    color: var(--muted);
    font-size: 12px;
    cursor: pointer;
    transition: all .2s
  }

  .quick-btn:hover {
    color: var(--text);
    border-color: var(--accent)
  }

  .progress-bar {
    height: 4px;
    background: var(--surface2);
    border-radius: 2px;
    margin-bottom: 1rem;
    overflow: hidden
  }

  .progress-fill {
    height: 100%;
    background: var(--accent2);
    border-radius: 2px;
    transition: width .5s linear;
    width: 100%
  }

  .sw-display {
    text-align: center;
    padding: 2rem 0 1rem
  }

  .sw-big {
    font-size: 84px;
    font-weight: 600;
    letter-spacing: -1px;
    font-variant-numeric: tabular-nums;
    color: var(--text);
  }

  .sw-controls {
    background: var(--surface);
    border: 0.5px solid var(--border);
    border-radius: 12px;
    padding: 1.25rem
  }

  .laps-list {
    margin-top: 1rem;
    max-height: 180px;
    overflow-y: auto
  }

  .lap-item {
    display: flex;
    justify-content: space-between;
    padding: 6px 0;
    border-bottom: 0.5px solid var(--border);
    font-size: 13px;
    font-variant-numeric: tabular-nums
  }

  .lap-num {
    color: var(--muted)
  }

  .lap-time {
    color: var(--text);
    font-weight: 500
  }

  .lap-diff {
    color: var(--accent2);
    font-size: 12px
  }
</style>

<div class="wrap" id="app">
  <div class="top-bar">
    <span class="logo"><span class="logo-icon" aria-hidden="true">⏰</span>KCLOCK</span>
    <button class="theme-btn" id="themeBtn">🌙 Dark Mode</button>
  </div>

  <div class="tabs">
    <button class="tab active" onclick="switchTab('clock')">clock</button>
    <button class="tab" onclick="switchTab('alarm')">alarm</button>
    <button class="tab" onclick="switchTab('timer')">timer</button>
    <button class="tab" onclick="switchTab('stopwatch')">stopwatch</button>
  </div>

  <div id="panel-clock" class="panel active">
    <div class="clock-display">
      <div class="time-big" id="clockTime">00:00:00</div>
      <div class="date-line" id="clockDate"></div>
    </div>
  </div>

  <div id="panel-alarm" class="panel">
    <div class="alarm-section">
      <div class="section-label">set alarm</div>
      <div class="time-inputs">
        <input class="time-input" type="number" id="alarmH" min="0" max="23" value="07" placeholder="HH">
        <span class="sep">:</span>
        <input class="time-input" type="number" id="alarmM" min="0" max="59" value="00" placeholder="MM">
      </div>
      <div class="btn-row">
        <button class="btn primary" id="alarmSetBtn" onclick="setAlarm()">set alarm</button>
        <button class="btn" id="alarmClearBtn" onclick="clearAlarm()" style="display:none">clear</button>
      </div>
      <div class="alarm-status" id="alarmStatus">no alarm set</div>
    </div>
  </div>

  <div id="panel-timer" class="panel">
    <div id="timerFullscreenArea" class="timer-fullscreen-area">
      <div class="timer-display">
        <button class="fullscreen-btn" id="timerFsBtn" onclick="toggleTimerFullscreen()" title="Fullscreen timer">⛶</button>
        <div class="timer-note" id="timerNoteDisplay"></div>
        <div class="timer-big" id="timerDisplay">00:00:00</div>
      </div>
    </div>
    <div class="timer-controls">
      <div class="section-label">note</div>
      <div class="note-row">
        <input class="note-input" type="text" id="timerNote" placeholder="e.g. break" oninput="updateTimerNoteDisplay()">
      </div>
      <div class="section-label">duration</div>
      <div class="duration-row">
        <input class="dur-input" type="number" id="timerH" min="0" max="23" value="0">
        <span class="dur-label">h</span>
        <input class="dur-input" type="number" id="timerM" min="0" max="59" value="5">
        <span class="dur-label">m</span>
        <input class="dur-input" type="number" id="timerS" min="0" max="59" value="0">
        <span class="dur-label">s</span>
      </div>
      <div class="quick-btns">
        <button class="quick-btn" onclick="setTimerQuick(60)">1 min</button>
        <button class="quick-btn" onclick="setTimerQuick(300)">5 min</button>
        <button class="quick-btn" onclick="setTimerQuick(600)">10 min</button>
        <button class="quick-btn" onclick="setTimerQuick(1800)">30 min</button>
        <button class="quick-btn" onclick="setTimerQuick(3600)">1 hr</button>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" id="timerProgress"></div>
      </div>
      <div class="btn-row">
        <button class="btn primary" id="timerStartBtn" onclick="timerToggle()">start</button>
        <button class="btn" onclick="timerReset()">reset</button>
      </div>
    </div>
  </div>

  <div id="panel-stopwatch" class="panel">
    <div class="sw-display">
      <div class="sw-big" id="swDisplay">00:00:00.0</div>
    </div>
    <div class="sw-controls">
      <div class="btn-row">
        <button class="btn primary" id="swStartBtn" onclick="swToggle()">start</button>
        <button class="btn" onclick="swLap()">lap</button>
        <button class="btn" onclick="swReset()">reset</button>
      </div>
      <div class="laps-list" id="lapsList"></div>
    </div>
  </div>
</div>

<script>
  let isDark = false;
  const themeBtn = document.getElementById('themeBtn');
  const timerFullscreenArea = document.getElementById('timerFullscreenArea');
  document.body.classList.add('light');
  document.documentElement.classList.add('light');
  if (timerFullscreenArea) {
    timerFullscreenArea.classList.add('light');
  }
  themeBtn.innerHTML = '🌙 Dark Mode';
  themeBtn.onclick = () => {
    isDark = !isDark;
    document.body.classList.toggle('light', !isDark);
    document.documentElement.classList.toggle('light', !isDark);
    if (timerFullscreenArea) {
      timerFullscreenArea.classList.toggle('light', !isDark);
      if (document.fullscreenElement === timerFullscreenArea || document.webkitFullscreenElement === timerFullscreenArea || document.mozFullScreenElement === timerFullscreenArea) {
        if (!isDark) {
          timerFullscreenArea.style.background = '#f5f5f0';
          timerFullscreenArea.style.color = '#1a1a1a';
        } else {
          timerFullscreenArea.style.background = '';
          timerFullscreenArea.style.color = '';
        }
      }
    }
    themeBtn.innerHTML = isDark ? '☀️ Light Mode' : '🌙 Dark Mode';
  };

  function switchTab(t) {
    document.querySelectorAll('.tab').forEach((b, i) => b.classList.toggle('active', ['clock', 'alarm', 'timer', 'stopwatch'][i] === t));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    document.getElementById('panel-' + t).classList.add('active');
  }

  function pad(n) { return String(Math.floor(n)).padStart(2, '0') }

  function updateClock() {
    const now = new Date();
    document.getElementById('clockTime').textContent = pad(now.getHours()) + ':' + pad(now.getMinutes()) + ':' + pad(now.getSeconds());
    document.getElementById('clockDate').textContent = now.toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
  }
  updateClock();
  setInterval(updateClock, 500);

  let alarmTime = null, alarmInterval = null, alarmRinging = false;
  function setAlarm() {
    const h = parseInt(document.getElementById('alarmH').value) || 0;
    const m = parseInt(document.getElementById('alarmM').value) || 0;
    alarmTime = { h, m };
    alarmRinging = false;
    document.getElementById('alarmStatus').textContent = 'alarm set for ' + pad(h) + ':' + pad(m);
    document.getElementById('alarmStatus').className = 'alarm-status set';
    document.getElementById('alarmClearBtn').style.display = '';
    document.getElementById('alarmSetBtn').textContent = 'update';
    if (alarmInterval) clearInterval(alarmInterval);
    alarmInterval = setInterval(checkAlarm, 500);
  }
  function clearAlarm() {
    alarmTime = null; alarmRinging = false;
    if (alarmInterval) clearInterval(alarmInterval);
    document.getElementById('alarmStatus').textContent = 'no alarm set';
    document.getElementById('alarmStatus').className = 'alarm-status';
    document.getElementById('alarmClearBtn').style.display = 'none';
    document.getElementById('alarmSetBtn').textContent = 'set alarm';
  }
  function checkAlarm() {
    if (!alarmTime || alarmRinging) return;
    const now = new Date();
    if (now.getHours() === alarmTime.h && now.getMinutes() === alarmTime.m && now.getSeconds() === 0) {
      alarmRinging = true;
      document.getElementById('alarmStatus').textContent = 'alarm ringing! — tap clear to stop';
      document.getElementById('alarmStatus').className = 'alarm-status ringing';
      ringSound();
    }
  }
  function ringSound() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      function beep(t) {
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.connect(g); g.connect(ctx.destination);
        o.frequency.value = 880; g.gain.value = 0.3;
        o.start(t); o.stop(t + 0.15);
      }
      for (let i = 0; i < 6; i++) beep(ctx.currentTime + i * 0.3);
    } catch (e) { }
  }

  let timerTotal = 300, timerLeft = 300, timerRunning = false, timerInterval = null;
  function setTimerQuick(s) {
    timerReset();
    timerTotal = s; timerLeft = s;
    const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
    document.getElementById('timerH').value = h;
    document.getElementById('timerM').value = m;
    document.getElementById('timerS').value = sec;
    renderTimer();
  }
  function updateTimerNoteDisplay() {
    const note = (document.getElementById('timerNote').value || '').trim();
    const display = document.getElementById('timerNoteDisplay');
    if (note) {
      display.textContent = note;
      display.style.display = 'flex';
    } else {
      display.textContent = '';
      display.style.display = 'none';
    }
  }

  function toggleTimerFullscreen() {
    const el = document.getElementById('timerFullscreenArea');
    if (!document.fullscreenElement) {
      el.requestFullscreen?.().catch(() => {});
    } else {
      document.exitFullscreen?.();
    }
  }

  document.addEventListener('fullscreenchange', () => {
    const el = document.getElementById('timerFullscreenArea');
    const full = Boolean(document.fullscreenElement);
    const btn = document.getElementById('timerFsBtn');
    if (el) {
      const isFull = full && (document.fullscreenElement === el || document.webkitFullscreenElement === el || document.mozFullScreenElement === el);
      el.classList.toggle('fullscreen-active', isFull);
      if (isFull && document.body.classList.contains('light')) {
        el.style.background = '#f5f5f0';
        el.style.color = '#1a1a1a';
      } else {
        el.style.background = '';
        el.style.color = '';
      }
    }
    if (btn) {
      btn.textContent = full ? '✕' : '⛶';
      btn.title = full ? 'Exit fullscreen' : 'Fullscreen timer';
    }
  });

  function timerToggle() {
    if (timerRunning) {
      clearInterval(timerInterval); timerRunning = false;
      document.getElementById('timerStartBtn').textContent = 'resume';
      updateTimerNoteDisplay();
    } else {
      if (timerLeft <= 0) {
        timerTotal = getTimerInput(); timerLeft = timerTotal;
      }
      timerRunning = true;
      document.getElementById('timerStartBtn').textContent = 'pause';
      updateTimerNoteDisplay();
      timerInterval = setInterval(() => {
        timerLeft--; renderTimer();
        if (timerLeft <= 0) {
          clearInterval(timerInterval); timerRunning = false;
          document.getElementById('timerStartBtn').textContent = 'start';
          ringSound();
          document.getElementById('timerDisplay').style.color = 'var(--danger)';
          setTimeout(() => document.getElementById('timerDisplay').style.color = '', 2000);
        }
      }, 1000);
    }
  }
  function timerReset() {
    clearInterval(timerInterval); timerRunning = false;
    timerLeft = getTimerInput(); timerTotal = timerLeft;
    document.getElementById('timerStartBtn').textContent = 'start';
    document.getElementById('timerDisplay').style.color = '';
    renderTimer();
    updateTimerNoteDisplay();
  }
  function getTimerInput() {
    return (parseInt(document.getElementById('timerH').value) || 0) * 3600 + (parseInt(document.getElementById('timerM').value) || 0) * 60 + (parseInt(document.getElementById('timerS').value) || 0) || 300;
  }
  function renderTimer() {
    const h = Math.floor(timerLeft / 3600), m = Math.floor((timerLeft % 3600) / 60), s = timerLeft % 60;
    document.getElementById('timerDisplay').textContent = pad(h) + ':' + pad(m) + ':' + pad(s);
    const pct = timerTotal > 0 ? Math.max(0, timerLeft / timerTotal * 100) : 100;
    document.getElementById('timerProgress').style.width = pct + '%';
  }
  renderTimer();
  updateTimerNoteDisplay();

  let swRunning = false, swStart = 0, swElapsed = 0, swInterval = null, laps = [], lastLap = 0;
  function swToggle() {
    if (swRunning) {
      swElapsed += Date.now() - swStart; swRunning = false; clearInterval(swInterval);
      document.getElementById('swStartBtn').textContent = 'resume';
    } else {
      swStart = Date.now(); swRunning = true;
      document.getElementById('swStartBtn').textContent = 'pause';
      swInterval = setInterval(renderSW, 100);
    }
  }
  function swLap() {
    if (!swRunning && swElapsed === 0) return;
    const total = swElapsed + (swRunning ? Date.now() - swStart : 0);
    const diff = total - lastLap; laps.unshift({ total, diff, n: laps.length + 1 }); lastLap = total;
    renderLaps();
  }
  function swReset() {
    clearInterval(swInterval); swRunning = false; swElapsed = 0; swStart = 0; lastLap = 0; laps = [];
    document.getElementById('swDisplay').textContent = '00:00:00.0';
    document.getElementById('swStartBtn').textContent = 'start';
    renderLaps();
  }
  function fmtSW(ms) {
    const h = Math.floor(ms / 3600000), m = Math.floor((ms % 3600000) / 60000), s = Math.floor((ms % 60000) / 1000), t = Math.floor((ms % 1000) / 100);
    return pad(h) + ':' + pad(m) + ':' + pad(s) + '.' + t;
  }
  function renderSW() {
    const t = swElapsed + (swRunning ? Date.now() - swStart : 0);
    document.getElementById('swDisplay').textContent = fmtSW(t);
  }
  function renderLaps() {
    document.getElementById('lapsList').innerHTML = laps.map(l => `<div class="lap-item"><span class="lap-num">lap ${l.n}</span><span class="lap-diff">+${fmtSW(l.diff)}</span><span class="lap-time">${fmtSW(l.total)}</span></div>`).join('');
  }
</script>
</body>
</html>
